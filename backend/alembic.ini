[alembic]
script_location = backend/alembic
prepend_sys_path = .
; NOTE: 不要在这里使用%(ENV)s插值（会触发configparser报错）。
; 实际连接串由 alembic/env.py 的 _get_sqlalchemy_url() 读取环境变量/默认值来提供。
sqlalchemy.url = mysql+pymysql://root:root123456@127.0.0.1:3306/gofer?charset=utf8mb4

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
